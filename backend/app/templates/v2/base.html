<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}re-skin v2{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/app.css" />
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/drive_sa_notice.js" defer></script>
  <script>
// Turn an error response body into something worth showing a human.
//
// Our own HTTPExceptions put a sentence in `detail`, but FastAPI's request
// validation answers a 422 with `detail` as an ARRAY of {loc, msg, type}
// objects — and every `'…' + body.detail` in the app renders that as
// "[object Object]", i.e. exactly nothing, for the one class of error where
// the field name is the whole point. Defined here (not per-fragment) so every
// fetch() error path on every page formats errors the same way; the HTMX
// fragments below are swapped in long after this has run.
function apiErrorText(body, response) {
  var fallback = (response && response.status)
    ? ('HTTP ' + response.status) : 'request failed';
  var detail = body ? body.detail : null;
  if (typeof detail === 'string' && detail.trim()) return detail;
  if (Array.isArray(detail)) {
    var parts = detail.map(function (item) {
      if (typeof item === 'string') return item;
      if (!item || typeof item !== 'object') return String(item);
      var where = Array.isArray(item.loc) ? item.loc.join('.') : '';
      var msg = item.msg || item.message || '';
      if (!msg) { try { return JSON.stringify(item); } catch (e) { return String(item); } }
      return where ? (where + ': ' + msg) : msg;
    }).filter(function (s) { return s; });
    if (parts.length) return parts.join('; ');
  }
  if (detail && typeof detail === 'object') {
    try { return JSON.stringify(detail); } catch (e) { /* fall through */ }
  }
  return fallback;
}
  </script>
</head>
<body>
  {% include "site_header.html" %}

    {% block content %}{% endblock %}
  </div>
</body>
