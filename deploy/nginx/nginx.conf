user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow large video uploads (up to 1 GB). Keep in sync with MAX_UPLOAD_SIZE_MB.
    client_max_body_size 1024m;

    # Fix #3: gzip for text responses (min 1 KB to avoid overhead on tiny responses).
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/plain;

    # Fix #4: map $http_upgrade so plain HTTP requests use "close" (required for
    # keepalive) while WebSocket upgrade requests still get "Upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # ── HTTPS (AICP-150) ────────────────────────────────────────────────────
    # The TLS name. No domain is owned, so it is the sslip.io wildcard-DNS name
    # for the box's IP; the certificate is a Let's Encrypt one issued for it
    # (deploy/tls/README.md). It is literal here and in ssl_certificate below:
    # nginx loads certificate paths at startup only when they hold no variables.
    map $scheme $tls_host {
        default 203-0-113-10.sslip.io;
    }

    # HSTS only on TLS responses (browsers ignore it over http anyway). One
    # year since 2026-10-17 (AICP-150; ramp history in deploy/tls/README.md).
    # No includeSubDomains / preload: sslip.io is a shared domain, not ours.
    map $scheme $hsts_header {
        https   "max-age=31536000";
        default "";
    }

    # Legacy plain-http :8847, kept for the transition: browser page loads
    # (GET/HEAD outside /api/) are sent to https BEFORE basic auth runs, so no
    # new password prompt happens over http. Everything programmatic keeps
    # working over http unchanged: /public/ token links (own location, no
    # redirect), /api/ calls and any non-GET (a 301 would turn a POST into a GET).
    map "$scheme $request_method $uri" $legacy_http_redirect {
        default 0;
        "~^http (GET|HEAD) /(?!api/)" 1;
    }

    # AICP-155: coarse per-client rate limit on the routes that START paid
    # kie.ai work (the location below lists them). Abuse/looping protection
    # only — the authoritative control is the daily budget the API enforces
    # (app/spend.py), which answers 429 with its own message. 30 requests per
    # minute sustained with an immediate burst of 20 is far above what an
    # operator clicks (one copy-batch launches 10 runs in ONE request). Keyed on
    # the TCP peer: nginx is exposed directly (:8847/:443) with no proxy in front,
    # so $binary_remote_addr is the real client and cannot be spoofed by a
    # header.
    # Reads (GET/HEAD — e.g. GET /runs/{id}/captions, GET /projects/{id}/runs)
    # share some of these paths and are never limited: an empty key is not
    # counted.
    map $request_method $kie_spend_key {
        GET     "";
        HEAD    "";
        default $binary_remote_addr;
    }
    limit_req_zone $kie_spend_key zone=kie_spend:10m rate=30r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # Fix #4: upstream block with keepalive so nginx reuses connections to uvicorn.
    upstream api_backend {
        server api:8000;
        keepalive 16;
    }

    # :80 exists only for ACME HTTP-01 and to bounce http:// to https://.
    server {
        listen 80 default_server;
        server_name _;

        # certbot --webroot writes challenge files here (host
        # /var/www/re-skin-acme, mounted read-only). No basic auth.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            # 308 keeps the method (a stray POST stays a POST).
            return 308 https://$tls_host$request_uri;
        }
    }

    # One server for both listeners so the routes below stay single-sourced:
    # :443 is the TLS front door, :8847 the legacy plain-http one.
    server {
        listen 8847;
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/203-0-113-10.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/203-0-113-10.sslip.io/privkey.pem;
        # Mozilla "intermediate" profile. No OCSP stapling: Let's Encrypt
        # certificates no longer carry an OCSP URL.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Empty on :8847, so not sent there. Inherited by every location below
        # (none of them sets its own add_header).
        add_header Strict-Transport-Security $hsts_header always;

        # Basic authentication
        auth_basic "re-skin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Fix #1: internal location for X-Accel-Redirect media serving.
        # The API sets X-Accel-Redirect: /internal/data/<relative-path> and nginx
        # opens the file directly from its bind-mounted ./data volume — no bytes
        # pass through Python/uvicorn.  Range requests work natively here.
        location /internal/data/ {
            internal;
            # Internal redirects re-run the access phase; without this, accel
            # responses for /public/ (token-authed, no basic-auth header) 401.
            auth_basic off;
            alias /app/data/;
        }

        # Public, token-signed media — no basic auth (the API validates the
        # per-resource HMAC token). Lets external tools (e.g. Gemini) fetch a
        # project's source video by link without the master password.
        location /public/ {
            auth_basic off;
            proxy_pass http://api_backend;
            # $http_host keeps the :8847 port (and has none on :443), so the
            # API can compare Origin to Host (AICP-152, app/csrf.py).
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300s;
            # Fix #4: keepalive requires HTTP/1.1 and Connection header cleared.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # AICP-155: credit-spending routes (writes only — see the map above).
        # Project create / analyze and runs/{id}/to-project are here because a
        # localisation project transcribes itself after analysis.
        # approve-preprocess starts the (already-reserved) video generation of a
        # run parked at preprocess_review. Same proxy
        # settings as `location /` below.
        location ~ ^/api/v2/(projects|projects/[^/]+/(runs|analyze|transcribe|localisation-prompt)|runs/[^/]+/(copy|copy-batch|retry|captions|to-project|approve-preprocess|regenerate-preprocess|regenerate-preprocess-ref/[0-9]+|segments/rerun|segments/[^/]+/(rerun|range-rerun|regenerate-image))|captions/[^/]+/retry)$ {
            limit_req zone=kie_spend burst=20 nodelay;
            error_page 429 = @kie_spend_rate_limited;

            proxy_pass http://api_backend;
            # $http_host keeps the :8847 port for the CSRF Origin check (AICP-152).
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # AICP-299: the knowledge external-repair upload (the JSON API and the
        # Outcome card's HTMX form post the same multipart body). Capped at the API's
        # 500 MB limit (+1 MiB multipart overhead) instead of the global 1 GiB,
        # and streamed unbuffered so the API's Content-Length/free-disk checks
        # reject an oversize body before nginx has spooled any of it.
        location ~ ^/(api/v2/knowledge/runs/[^/]+|v2/runs/[^/]+/knowledge)/external-repair$ {
            client_max_body_size 501m;
            proxy_request_buffering off;

            proxy_pass http://api_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # JSON body so the UI's `body.detail` alert shows a readable reason.
        # Only reached for nginx's OWN 429 (error_page does not intercept an
        # upstream 429 — proxy_intercept_errors is off), so the API's
        # over-budget 429 message passes through untouched.
        location @kie_spend_rate_limited {
            default_type application/json;
            # Any add_header here stops the server-level one being inherited,
            # so HSTS is repeated (empty on :8847, i.e. not sent there).
            add_header Strict-Transport-Security $hsts_header always;
            add_header Retry-After 60 always;
            return 429 '{"detail":"Too many paid requests from this address in a short time (rate limit). Wait a minute and try again."}';
        }

        location / {
            # :8847 browser page loads -> https (see $legacy_http_redirect).
            # `return` runs in the rewrite phase, before auth_basic.
            if ($legacy_http_redirect) {
                return 301 https://$tls_host$request_uri;
            }

            proxy_pass http://api_backend;
            # $http_host keeps the :8847 port (and has none on :443), so the
            # API can compare Origin to Host (AICP-152, app/csrf.py).
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # Long timeouts for large video uploads and slow AI responses
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Fix #4: keepalive + WebSocket upgrade support via the map above.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
