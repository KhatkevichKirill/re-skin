# Seed guidance for AICP-297 / AICP-293. Loader format: see README.md.
# Every rule is shareable: false. No `evidence:` links anywhere: the repo records
# only 8-character run ids, and a link needs a kb_cases row for a full run id.
rules:
  # ---- the three operator observations (design docs/knowledge-feedback-design.md §2.3, §13) ----
  - slug: o1-gemini-omni-text-replacement
    kind: operator_constraint
    statement: "Avoid Gemini Omni for text replacement (subtitle removal / cover change) in the scenarios tested."
    rationale: "Operator constraint stated by Operator on 2026-10-26 and confirmed 2026-10-27 (design §13 item 3): the advisor WARNS, it does not forbid and it does not change the subtitle_removal default model in project_types.py. 'Text replacement' maps to subtitle_removal and cover_change projects (design §2.3). This is a constraint on what the operator wants, not a measured model fact."
    applicability: {operation: [subtitle_removal, cover_change]}
    recommendation: {action: warn, target: {model_key: gemini-omni}}
    confidence: operator_asserted
    shareable: false
    effective_from: "2026-10-26T00:00:00Z"
    author_label: "Operator (AICP-293)"
    provenance: {source: "Operator observation O1, 2026-10-26; decision 2026-10-27", linear: "AICP-293", doc: "docs/knowledge-feedback-design.md §2.3, §13"}
    evidence_gaps:
      - "Which runs were the failing tests and which succeeded is unrecorded; 12 subtitle_removal and 5 cover_change gemini-omni runs are 'done' (design §2.3) but none is labeled."
      - "Where Gemini Omni DOES work for text replacement is not identified; the observation asked for that to be found."
      - "subtitle_removal still defaults to gemini-omni in project_types.py; this rule warns, the default was deliberately not changed."

  - slug: o2-seedance-2-0-over-2-5-without-long-shot
    kind: empirical_guidance
    statement: "When a long continuous shot is not needed (segments of at most 15 s), base Seedance 2.0 is preferable to Seedance 2.5."
    rationale: "Operator-reported preference (Operator, 2026-10-26): 2.0 is better and cheaper than 2.5 when 2.5's 30 s clip ceiling is unnecessary. 'Seedance 2' was confirmed on 2026-10-27 to mean the base key `seedance` (2.0), not Fast or Mini (design §13 item 1). REPORTED, not measured: no comparable-quality labels exist, and the only quantitative cost data in the repo is the wiki's community estimate (2.5 about 0.23 USD/s at 720p) plus 2.5's measured 38 credits per second of input plus output (wiki/models/kling-4-0.md). A matched seedance vs seedance-2-5 cost comparison from settled kie_spend_draws (available only since 2026-10-17) has not been done. Do not present this as a vendor fact."
    applicability: {operation: [face_swap], model_family: [seedance], segment_sec_band: ["[0,10)", "[10,15)"]}
    recommendation: {action: prefer, target: {model_key: seedance}}
    confidence: low
    shareable: false
    effective_from: "2026-10-26T00:00:00Z"
    author_label: "Operator (AICP-293)"
    provenance: {source: "Operator observation O2, 2026-10-26; variant confirmed 2026-10-27", linear: "AICP-293", doc: "docs/knowledge-feedback-design.md §2.3, §13", wiki: "wiki/models/ai-models.md#cost"}
    evidence_gaps:
      - "Quality claim is operator-reported only; no accepted/rejected labels compare seedance and seedance-2-5 on the same sources."
      - "Cost claim not measured: settled spend draws for matched seedance vs seedance-2-5 segments have not been compared."
      - "The face_swap operation scope is an assumption; the observation did not name an operation."
      - "Base seedance max_clip_sec is 15 s; 1080p and generate_audio differences between the two were not factored in."

  - slug: o3-source-faces-retained-under-seedance
    kind: machine_hypothesis
    statement: "Two or three source characters appear to keep their original face under Seedance video-to-video, despite different target personas and ChatGPT frame-derived reference images."
    rationale: "Operator observation O3 (2026-10-26) about specific sources, not about the model in general. Subject advice is OFF: Operator has not yet named the subjects (design §13 item 2, §9.3), so no subject_id scoping exists and nothing here may be applied; machine_hypothesis versions are listed as hypotheses only and are never effective (design §4.6). The §9.3 trigger (at least 2 operator source_face_retained defects for one subject, with distinct reference sets) cannot fire until labels exist."
    applicability: {model_family: [seedance]}
    recommendation: {action: warn, target: {model_family: seedance}}
    confidence: low
    shareable: false
    effective_from: "2026-10-26T00:00:00Z"
    author_label: "Operator (AICP-293)"
    provenance: {source: "Operator observation O3, 2026-10-26", linear: "AICP-293", doc: "docs/knowledge-feedback-design.md §2.3, §9.3, §13"}
    evidence_gaps:
      - "The assets are not identified; no label records face retention for any run."
      - "Unconfirmed candidate projects, chosen only by override intensity (NOT confirmed by the operator): project A (29 overridden segments over 11 runs), project B (10/11), project C (8/11), projects D and E."
      - "First operator task in AICP-297/299 is to name the 2-3 subjects; only then can kb_subject_links and source_face_retained defects be recorded."
      - "Not known whether the effect is specific to Seedance or to the source footage."

  # ---- well-evidenced empirical guidance from the wiki / design inventory ----
  - slug: seedance-2-5-short-result-accept-and-badge
    kind: empirical_guidance
    statement: "Seedance 2.5 intermittently returns a result cut to exactly 14.72 s while reporting success; expect it on long segments, accept and flag it (the 'short result' badge), and do not lower max_clip_sec to avoid it."
    rationale: "Measured: 4 of 11 generations from clips of 19-29.3 s came back at 14.720 s (roughly 2 in 3 succeed), independent of clip length, resolution and reference size; the identical 27.5 s segment gave 27.392 s on one run and 14.720 s on another. Lowering max_clip_sec to 14.5 threw away the successful majority and delivered un-swapped original footage (run f267bede) and was reverted. The truncated tail is never generated, and the speech is crammed into the remaining time, so lip sync is off. Retained behavior is the operator's call: stitch every result and show the shortfall."
    applicability: {model_key: [seedance-2-5], segment_sec_band: ["[15,30]"]}
    recommendation: {action: warn, target: {model_key: seedance-2-5}}
    confidence: medium
    shareable: false
    effective_from: "2026-10-27T00:00:00Z"
    author_label: "importer (AICP-297)"
    provenance: {source: "wiki/models/ai-models.md#intermittent-truncation-1472s", linear: "AICP-297", doc: "docs/knowledge-feedback-design.md §2.2", runs_short_ids: "8169b9b5, b6265eec, 4e631e56, be4343ef truncated; f267bede un-swapped fallback"}
    evidence_gaps:
      - "Sample is 11 generations, all 720p; 1080p and later runs are not in the table (wiki/models/kling-4-0.md later gives about one in three)."
      - "Cause is unknown; no prompt or parameter that prevents it has been found."
      - "Whether a clip of 15 s or less is affected was not measured (only clips over 14.72 s can show it)."
      - "Evidence links omitted: the repo holds only 8-character run ids."

  - slug: seedance-2-5-resubmit-after-short-result-rebills
    kind: empirical_guidance
    statement: "Do not blindly resubmit a Seedance 2.5 segment that came back short; the retry has mostly returned the same 14.72 s result and bills again."
    rationale: "Auto-retry was tried and removed: three resubmits of run 4e631e56 with the clip length spelled out in the prompt all returned 14.72 s. Billing for 2.5 is 38 credits per second of input plus output (wiki/models/kling-4-0.md), so each retry is a full re-bill. Knowledge has no execution authority: this is advice, retries stay allowed."
    applicability: {model_key: [seedance-2-5], segment_sec_band: ["[15,30]"]}
    recommendation: {action: avoid, target: "blind resubmission of a short-result segment on seedance-2-5"}
    confidence: low
    shareable: false
    effective_from: "2026-10-27T00:00:00Z"
    author_label: "importer (AICP-297)"
    provenance: {source: "wiki/models/ai-models.md#intermittent-truncation-1472s", linear: "AICP-297", doc: "docs/knowledge-feedback-design.md §2.2", runs_short_ids: "4e631e56"}
    evidence_gaps:
      - "One run, three retries; a retry after a different change (different references or split segment) was not measured."
      - "Whether a split of the segment avoids the cut has not been tested."

  - slug: gemini-omni-10s-cap-original-footage
    kind: empirical_guidance
    statement: "Gemini Omni cannot generate swap segments longer than 10 s; a longer segment is skipped and the run delivers that part as original, un-swapped footage."
    rationale: "Registry fact in ai_models.py (max_clip_sec 10, outputs of 4/6/8/10 s) and documented behavior: over-long swap segments are marked failed with source_fallback and the run still reaches done, partly swapped. This is a deterministic constraint, not an outcome study. The band [10,15) is used because bands are half-open; a segment of exactly 10.0 s fits."
    applicability: {model_key: [gemini-omni], segment_sec_band: ["[10,15)", "[15,30]", ">30"]}
    recommendation: {action: warn, target: {model_key: gemini-omni}}
    confidence: medium
    shareable: false
    effective_from: "2026-10-27T00:00:00Z"
    author_label: "importer (AICP-297)"
    provenance: {source: "wiki/models/ai-models.md#gemini-omni-google", linear: "AICP-297", doc: "backend/app/ai_models.py (gemini-omni spec)"}
    evidence_gaps:
      - "Not measured as a quality outcome; no run is cited."
      - "Overlaps with rule o1 for subtitle_removal / cover_change; the advisor shows both."

  - slug: kling-4-0-avoid-for-face-swap-and-localisation
    kind: empirical_guidance
    statement: "Do not use Kling 4.0 video-to-video for face swap or localisation; Seedance 2.5 was better in the 2026-10-22/23 evaluation."
    rationale: "Eval on kie.ai: Kling rewrote burned-in captions (contradicting the kept original audio), edited a cutaway, and drifted from the source performance (SSIM 0.63-0.65 vs Seedance 0.83); in localisation it invented or paraphrased about half the script even with a strict timestamped prompt. Kling is not in the model registry; this guards manual use only."
    applicability: {operation: [face_swap, localisation]}
    recommendation: {action: avoid, target: "kling-4.0 reference-to-video for video-to-video face swap or localisation"}
    confidence: low
    shareable: false
    effective_from: "2026-10-27T00:00:00Z"
    author_label: "importer (AICP-297)"
    provenance: {source: "wiki/models/kling-4-0.md (T1, T2)", linear: "AICP-297", doc: "docs/knowledge-feedback-design.md §2.2"}
    evidence_gaps:
      - "One face-swap segment (3 repeats at 720p, 1 at 1080p) and one localisation clip; small samples."
      - "No operator quality labels; comparison used SSIM and transcript checks."
      - "Kling 4.0 may gain a video-editing mode later, which this does not cover."

  - slug: kling-4-0-images-only-rebuild-cost
