  # ---- brand-name repair in localisation speech (added 2026-10-28) ----
  - slug: localisation-brand-mispronunciation-word-splice
    kind: empirical_guidance
    statement: "When Seedance mispronounces 'Listenify' in a delivered localisation run, re-voice only that word in place. Splice it from a sibling run that says it correctly; if there is none, generate a short Seedance 2.5 window with the run's own voice as reference audio and splice only the word. Do not regenerate the whole run."
    rationale: "Seedance writes localisation speech itself and mispronounces the brand at random ('ListenFood', 'listenfarks'), so a full re-run costs 38 credits per second of input plus output and can come back wrong again. Repair order used in production: (1) a sibling of the same project that says it right -> the app's 'Fix audio from another run' (RunAudioPatch, media.splice_audio_window), which is free and keeps the Job ID and Drive link (runs 3eb88752-es, cdb8fe52-pt); (2) no usable sibling -> one-shot Seedance 2.5 takes on a ~5 s window that starts in the pause before the phrase, fed the run's own swap clip, reference_audio_urls set to ~20 s of this run's final without the bad word (keeps the timbre), aspect_ratio adaptive, duration -1, generate_audio true, and a prompt holding only that window's line plus 'Listenify is a brand name and is pronounced in English'. Then splice only the word's window (here [4.28, 5.00]) into the final: video stream-copied, nothing outside the window moves, Drive content replaced under the same file id (run 9f253b98-pt, 2026-10-28: two takes for 380 + 342 credits, and the operator chose the take with the plain brand line over a phonetic respelling 'Spichifai'); (3) a second, garbled brand word on camera is muted, not cut, because cutting it desyncs the rest (cdb8fe52-pt). A prompt line alone is not a fix: the 3b1ea5c7-es rebuild had the line and still needed a splice. Whisper cannot judge brand pronunciation (it wrote 'Speechfied' for a correct English take), so the operator picks by ear from previews of the final around the word."
    applicability: {operation: [localisation], model_family: [seedance]}
    recommendation: {action: prefer, target: "re-voicing only the mispronounced brand word in place (sibling donor first, else a short voice-referenced Seedance 2.5 window) over regenerating the run"}
    confidence: low
    shareable: false
    effective_from: "2026-10-28T00:00:00Z"
    author_label: "importer (AICP-293)"
    provenance: {source: "Manual repairs 2026-09-07 (3eb88752-es), 2026-10-16 (cdb8fe52-pt), 2026-10-17 (3b1ea5c7-es), 2026-10-28 (9f253b98-pt)", linear: "AICP-293", doc: "docs/run-audio-patch.md", runs_short_ids: "9f253b98-pt, 3eb88752-es, cdb8fe52-pt, 3b1ea5c7-es", runs_full_ids: "9f253b98-23c2-4a65-ae7a-d69214c81348, 3eb88752-2a70-4264-8556-e70d8fcfc426, cdb8fe52-50fd-4ad6-8368-9e02ae0074e4, 3b1ea5c7-7c18-4d2a-ba79-deabe9f2c715"}
    evidence_gaps:
      - "Path (2) is a manual script (kie createTask with retries disabled, then media.splice_audio_window); the app has no 'regenerate a word' action, so an assistant can propose it but an operator or engineer runs it."
      - "Four repaired runs, all with the brand early in the clip (3-6 s); sibling alignment drifts to ~1 s by 30 s, so a late-clip word needs its own donor offset."
      - "Success rate of the brand line or a phonetic respelling per take is unmeasured; the 2026-10-28 choice between the two takes was one operator's ear, not a measurement."
      - "Only Listenify was observed; other brand names are assumed to behave the same."
      - "No evidence links: these runs have no kb_cases rows yet (all are in development-split groups, none in holdout)."

  - slug: regenerated-word-donor-level-eq-match
    kind: empirical_guidance
    statement: "Before splicing a word from a separately generated take, match its loudness and EQ to the run's own voice; otherwise the word sounds distant even when the take sounds fine on its own."
    rationale: "Run 9f253b98-pt, 2026-10-28: the regenerated take was 2.6 dB quieter and about 3 dB thinner at 80-200 Hz and 400-1600 Hz than the run's voice on the same words. Spliced as-is, the operator heard the brand 'as if he stepped away'; the operator had judged the takes by themselves and only noticed it in context. Fix: compare 8-band spectra of the SAME words in the base and the take, apply the per-band difference to the take with ffmpeg firequalizer (gain_entry per band), splice again, and send the operator previews of the final around the word (about 2.5 s either side), not the raw takes. The matched word measured -19.6 dB RMS against -20.0 dB of the neighbouring speech, and the operator accepted it. A sibling donor from the same run family did not need this on 3eb88752-es."
    applicability: {operation: [localisation], model_family: [seedance]}
    recommendation: {action: require, target: "level and EQ match of a separately generated donor take before an audio splice"}
    confidence: low
    shareable: false
    effective_from: "2026-10-28T00:00:00Z"
    author_label: "importer (AICP-293)"
    provenance: {source: "Manual repair 2026-10-28, run 9f253b98-pt (backups in data/scratch/listenify-9f253b98-20261028)", linear: "AICP-293", runs_short_ids: "9f253b98-pt", runs_full_ids: "9f253b98-23c2-4a65-ae7a-d69214c81348"}
    evidence_gaps:
      - "One case; reverberation differences, which EQ cannot fix, were not measured."
      - "Whether sibling-run donors need the same matching is not measured (one sibling splice, 3eb88752-es, sounded fine without it)."
      - "No evidence links: the run has no kb_cases row yet."

  # ---- gender-mismatched hands: full record of run 3b1ea5c7-es (added 2026-10-28) ----
  - slug: v2v-keeps-source-hands-on-gender-mismatch
    kind: empirical_guidance
    statement: "Video-to-video Seedance 2.5 and Gemini Omni keep the source's hands and manicure. When a female source gets a male persona, the hands stay female, and no prompt, hand reference image or hands-only crop has changed that. Do not spend more generations trying to fix the hands inside a video-to-video run."
    rationale: "Run 3b1ea5c7-es (project 77e0e370 DidYouKnowYouCanTurnReadToListen, localisation, Seedance 2.5, AICP-243, 2026-10-17): face and lip-sync on the male persona were good, but his hands kept the source's long almond nails, clearly visible at 6-9 s and 17-21 s. The operator had already tried hard prompting on earlier runs and it never worked. All tests below used one 4 s full-frame window (16.5-20.5 s of the final), cut out with extract-insert: (1) Gemini Omni v2v with a 'change only the hands' prompt (~170 cr): nails unchanged, and the gestures drifted ~0.5 s from the original. Omni regenerates the clip rather than editing it, so it also breaks lip sync with the kept audio. (2) Seedance 2.5 v2v with 9 refs, the persona photo plus 8 frames of this window that GPT Image 2.5 had redrawn with convincing male hands and short nails, and a long hands-only prompt (~50 cr GPT Image + ~300 cr Seedance). Motion matched almost frame for frame, but the nails stayed long. (3) The same with a 1:1 1080x1080 hands-only crop (no face), a male-hands photo at ref 0, 8 GPT Image 1:1 male-hand frames, and the operator's prompt 'Change woman's hands to man's hands in the reference image. Do not change movements and everything else' (~350 cr). The nails stayed long again. Conclusion: Seedance treats the hands in the input video as content to preserve. Framing, reference count and prompt wording are not the lever. Free fallback: a hard-cut ~2x punch-in on the face (crop 528x940 -> 1080x1920, lanczos + unsharp) hides hands held at chest height. It cannot hide a hand at the chin, and more than 3-4 zooms in 30 s look intrusive. What was finally delivered is the images-only rebuild in rule images-only-rebuild-fixes-gender-mismatched-hands."
    applicability: {operation: [face_swap, localisation], model_key: [seedance-2-5, gemini-omni]}
    recommendation: {action: warn, target: "video-to-video swap onto a persona of a different gender when hands are visible; hand fixes inside v2v (prompt, hand refs, hands-only crop)"}
    confidence: low
    shareable: false
    effective_from: "2026-10-28T00:00:00Z"
    author_label: "importer (AICP-293)"
    provenance: {source: "Manual tests 2026-10-17 on run 3b1ea5c7-es (Claude session d6f70576), Linear AICP-243", linear: "AICP-243", runs_short_ids: "3b1ea5c7-es; test runs 98c9b8e5 (Omni), a33f0602 (Seedance + hand refs), 8876ba1f (1:1 crop), deleted 2026-10-17", runs_full_ids: "3b1ea5c7-7c18-4d2a-ba79-deabe9f2c715", project_ids: "77e0e370-8b8b-43dd-a428-3f2831555106"}
    evidence_gaps:
      - "One source and one persona; base seedance, fast and mini were not tested."
      - "How often hands show the source gender on other gender-mismatched swaps is unknown; the source here had near-constant hand gestures close to the camera."
      - "Credit figures are session estimates; the operator checked the real spend in the kie.ai account, and it is not recorded."
      - "Test runs and projects (fca109e6, 51511124, bb9e67b6) were deleted on 2026-10-17, so no case rows can be made for them."
      - "No evidence links: run 3b1ea5c7-es has no kb_cases row yet (development split, not holdout)."

  - slug: images-only-rebuild-fixes-gender-mismatched-hands
    kind: empirical_guidance
    statement: "When a delivered swap has the source's opposite-gender hands, rebuild the whole creative images-only with Seedance 2.5: GPT Image edits of frames from the run's own final with only the hands changed, plus the persona photo, as references, and the full script as the prompt, with no reference video. Then, if needed, raise the resolution with a Seedance 2.5 video-to-video pass over that rebuild. The hands stay correct because the input video now has the right hands."
    rationale: "Delivered for run 3b1ea5c7-es on 2026-10-17 (AICP-243), after every v2v hand fix failed (rule v2v-keeps-source-hands-on-gender-mismatch). Steps: (1) References: 8 frames taken from the run's final, so they already show the male persona in the source's room and in the woman's original poses. GPT Image 2.5 edited them with one per-image prompt: keep everything in the frame exactly the same (face, pose, t-shirt, background, framing, finger positions) and change ONLY the hands to an adult man's hands (broader palms, thicker fingers, knuckles, some hair, SHORT plain unpolished nails; no almond or salon nails, no polish). All 8 came out convincing. The pipeline caps refs at MAX_REFERENCE_IMAGES=5, so a second, never-approved preprocess run made 4 more images. They were appended by SQL to the main run's ref lists at preprocess_review, giving 9 refs, the Seedance maximum. (2) A 5 s, 480p images-only probe (~200 cr) confirmed male hands with short nails, the same person, shirt, desk, laptop and painting, but its own gestures and its own voice. Gemini Omni images-only failed 6 of 6 with task-level 'Internal Error' (gemini-omni-video and google/gemini-omni-flash-1-1, 1-7 images, PNG and JPEG, with and without the brand line), and that track was dropped. (3) The whole 29.7 s creative was generated as ONE 30 s take, at the operator's request, instead of chunks with seams. Seedance 2.5 images-only: persona photo + 8 frames, 480p, aspect 9:16, duration 30, generate_audio true. The prompt describes the scene and person and asks for natural hand gestures in front of the chest, explicitly with a man's hands and short nails. It carries the operator's mandatory line 'The person tells about \"Listenify App\" that is a brand and pronounce in english.' and the full Spanish script. It came back the full 30.04 s, not truncated, with every line spoken (one stray inserted word, 'pedículos'), at about 1200 cr. (4) 'Listenify' was still mispronounced, so that word was spliced from the original run's audio (3.74-4.52 s, trimmed to end at 4.415 s to drop an audible '-ed'), see rule localisation-brand-mispronunciation-word-splice. (5) A Seedance 2.5 v2v pass at 720p raised the resolution: the 480p rebuild (trimmed to 29.9 s, the 2.5 input cap) with the patched audio in the input, the same 9 refs, aspect adaptive, duration -1. It came out sharper (visible veins and t-shirt folds), the hands stayed male, and the motion repeated the rebuild frame for frame. It ran ~0.65 % fast (713 of 718 frames), fixed with setpts=PTS*29.9/29.708,fps=24 (residual 1 frame or less). Its own audio re-voiced the input with the same mispronunciation, so the patched track was kept. (6) Finishing: upscaled to 1080x1920@30, CTA_Spanish_Book appended (54.5 s total, 35.7 MB), and the Drive content was replaced under the same file id, so the Job ID and link are unchanged. runs.result_local_path and result_duration_sec were repointed by SQL, and the old final.mp4 was kept as a backup. Captions came from the known script, not from transcription: a run_captions row with lines_source=manual, status=failed and 14 script lines timed from whisper word stamps (the stray word left out), then POST /captions/{id}/retry, and the worker goes straight to burning. Trade-off the operator accepted: the result is a new performance (new gestures and voice) of the same person, scene and text, not an edit of the original."
