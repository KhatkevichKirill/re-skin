    rationale: "Measured on one 30 s rebuild with the same 8 GPT Image 2.5 2K frames and script (run 0abca08e, AICP-256): per-task creditsConsumed matched the price page. Keyframe mode has no voice input and Kling audio peaks at 0 dBFS (normalise before delivery). The images-only rebuild is manual, not available in the app (AICP-258), and is never auto-selected."
    applicability: {operation: [images_only_rebuild_manual]}
